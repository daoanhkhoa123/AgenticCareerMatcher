<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <!-- User -->
  <rect x="400" y="15" width="200" height="42" rx="8" fill="#F0F0F0" stroke="#888" stroke-width="1.5"/>
  <text x="500" y="41" text-anchor="middle" font-size="15" fill="#222">User (browser)</text>
  <line x1="500" y1="57" x2="500" y2="88" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Streamlit host outer box -->
  <rect x="90" y="90" width="820" height="185" rx="10" fill="#EAF2FF" stroke="#3B6FD4" stroke-width="1.5"/>
  <text x="500" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3E8C">
    Streamlit Host — mcp_host/app.py  (the MCP Host)
  </text>

  <!-- Inner: Gemini client + loop -->
  <rect x="130" y="135" width="340" height="115" rx="8" fill="#ffffff" stroke="#3B6FD4" stroke-width="1.2"/>
  <text x="300" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3E8C">Gemini LLM client</text>
  <text x="300" y="180" text-anchor="middle" font-size="12" fill="#333">llm/gemini_client.py</text>
  <text x="300" y="200" text-anchor="middle" font-size="12" fill="#333">tool-calling loop</text>
  <text x="300" y="218" text-anchor="middle" font-size="12" fill="#333">mcp_host/llm.py</text>

  <!-- Inner: MCP client -->
  <rect x="530" y="135" width="340" height="115" rx="8" fill="#ffffff" stroke="#3B6FD4" stroke-width="1.2"/>
  <text x="700" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3E8C">MCP Client</text>
  <text x="700" y="180" text-anchor="middle" font-size="12" fill="#333">mcp_host/mcp_bridge.py</text>
  <text x="700" y="200" text-anchor="middle" font-size="12" fill="#333">persistent stdio connection</text>
  <text x="700" y="218" text-anchor="middle" font-size="12" fill="#333">per server</text>

  <line x1="470" y1="192" x2="530" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="185" text-anchor="middle" font-size="10" fill="#555">tool schemas / calls</text>

  <!-- Arrows down to servers -->
  <line x1="285" y1="275" x2="285" y2="325" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="300" text-anchor="middle" font-size="11" fill="#555">stdio</text>
  <line x1="715" y1="275" x2="715" y2="325" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="300" text-anchor="middle" font-size="11" fill="#555">stdio</text>

  <!-- Server 1: career-matcher-mcp -->
  <rect x="90" y="330" width="380" height="140" rx="10" fill="#EAFBEA" stroke="#2E9E44" stroke-width="1.5"/>
  <text x="280" y="355" text-anchor="middle" font-size="15" font-weight="600" fill="#1D6E2C">career-matcher-mcp</text>
  <text x="280" y="373" text-anchor="middle" font-size="11" fill="#333">mcp_servers/career_matcher/</text>
  <text x="280" y="398" text-anchor="middle" font-size="12" fill="#222">• match_jobs_from_prompt</text>
  <text x="280" y="418" text-anchor="middle" font-size="12" fill="#222">• match_jobs_from_cv</text>
  <text x="280" y="443" text-anchor="middle" font-size="11" fill="#555">(CV parsing calls Gemini)</text>

  <!-- Server 2: job-crawler-mcp -->
  <rect x="530" y="330" width="380" height="140" rx="10" fill="#EAFBEA" stroke="#2E9E44" stroke-width="1.5"/>
  <text x="720" y="355" text-anchor="middle" font-size="15" font-weight="600" fill="#1D6E2C">job-crawler-mcp</text>
  <text x="720" y="373" text-anchor="middle" font-size="11" fill="#333">mcp_servers/crawler/</text>
  <text x="720" y="398" text-anchor="middle" font-size="12" fill="#222">• trigger_crawler</text>
  <text x="720" y="418" text-anchor="middle" font-size="12" fill="#222">• list_supported_sites</text>
  <text x="720" y="443" text-anchor="middle" font-size="11" fill="#555">(itviec.com dedicated + generic Firecrawl fallback)</text>

  <!-- External APIs -->
  <rect x="30" y="540" width="190" height="55" rx="8" fill="#FFF4E5" stroke="#C9791A" stroke-width="1.5"/>
  <text x="125" y="562" text-anchor="middle" font-size="13" font-weight="600" fill="#8A5310">Gemini API</text>
  <text x="125" y="580" text-anchor="middle" font-size="11" fill="#333">(external)</text>

  <rect x="780" y="540" width="190" height="55" rx="8" fill="#FFF4E5" stroke="#C9791A" stroke-width="1.5"/>
  <text x="875" y="562" text-anchor="middle" font-size="13" font-weight="600" fill="#8A5310">Firecrawl API</text>
  <text x="875" y="580" text-anchor="middle" font-size="11" fill="#333">(external)</text>

  <!-- Postgres -->
  <rect x="330" y="595" width="340" height="65" rx="8" fill="#F3EAFB" stroke="#7A3FB5" stroke-width="1.5"/>
  <text x="500" y="620" text-anchor="middle" font-size="13" font-weight="600" fill="#4E1F80">PostgreSQL — jobs table</text>
  <text x="500" y="640" text-anchor="middle" font-size="11" fill="#333">third_party/postgre_sql/ (Docker Compose)</text>

  <!-- Server1 -> Gemini API -->
  <line x1="180" y1="470" x2="135" y2="538" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Host Gemini client -> Gemini API (long line down left margin) -->
  <line x1="150" y1="250" x2="150" y2="440" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="150" y1="440" x2="115" y2="538" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Server2 -> Firecrawl API -->
  <line x1="820" y1="470" x2="865" y2="538" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Server1 -> Postgres -->
  <line x1="380" y1="470" x2="440" y2="593" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Server2 -> Postgres -->
  <line x1="630" y1="470" x2="565" y2="593" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
