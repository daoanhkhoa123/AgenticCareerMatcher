<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="760" fill="#ffffff"/>

  <!-- User -->
  <rect x="450" y="15" width="200" height="42" rx="8" fill="#F0F0F0" stroke="#888" stroke-width="1.5"/>
  <text x="550" y="41" text-anchor="middle" font-size="15" fill="#222">User (browser)</text>
  <line x1="550" y1="57" x2="550" y2="83" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Streamlit host outer box -->
  <rect x="90" y="85" width="920" height="180" rx="10" fill="#EAF2FF" stroke="#3B6FD4" stroke-width="1.5"/>
  <text x="550" y="107" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3E8C">
    Streamlit Host — mcp_host/app.py  (the MCP Host)
  </text>

  <!-- Inner: Groq client + loop -->
  <rect x="130" y="130" width="400" height="112" rx="8" fill="#ffffff" stroke="#3B6FD4" stroke-width="1.2"/>
  <text x="330" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3E8C">Groq LLM client</text>
  <text x="330" y="177" text-anchor="middle" font-size="12" fill="#333">llm/groq_client.py</text>
  <text x="330" y="197" text-anchor="middle" font-size="12" fill="#333">tool-calling loop</text>
  <text x="330" y="216" text-anchor="middle" font-size="12" fill="#333">mcp_host/llm.py</text>

  <!-- Inner: MCP client -->
  <rect x="570" y="130" width="400" height="112" rx="8" fill="#ffffff" stroke="#3B6FD4" stroke-width="1.2"/>
  <text x="770" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3E8C">MCP Client</text>
  <text x="770" y="177" text-anchor="middle" font-size="12" fill="#333">mcp_host/mcp_bridge.py</text>
  <text x="770" y="197" text-anchor="middle" font-size="12" fill="#333">persistent stdio connection</text>
  <text x="770" y="216" text-anchor="middle" font-size="12" fill="#333">per server (three servers)</text>

  <line x1="530" y1="186" x2="570" y2="186" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="550" y="179" text-anchor="middle" font-size="9" fill="#555">tool schemas / calls</text>

  <!-- Arrows down to servers -->
  <line x1="215" y1="265" x2="215" y2="318" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="535" y1="265" x2="535" y2="318" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="855" y1="265" x2="855" y2="318" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="295" text-anchor="middle" font-size="10" fill="#555">stdio</text>
  <text x="535" y="295" text-anchor="middle" font-size="10" fill="#555">stdio</text>
  <text x="855" y="295" text-anchor="middle" font-size="10" fill="#555">stdio</text>

  <!-- Server 1: career-matcher-mcp -->
  <rect x="70" y="320" width="290" height="130" rx="10" fill="#EAFBEA" stroke="#2E9E44" stroke-width="1.5"/>
  <text x="215" y="343" text-anchor="middle" font-size="14" font-weight="600" fill="#1D6E2C">career-matcher-mcp</text>
  <text x="215" y="360" text-anchor="middle" font-size="10.5" fill="#333">mcp_servers/career_matcher/</text>
  <text x="215" y="383" text-anchor="middle" font-size="11" fill="#222">• match_jobs_from_prompt</text>
  <text x="215" y="401" text-anchor="middle" font-size="11" fill="#222">• match_jobs_from_cv</text>
  <text x="215" y="422" text-anchor="middle" font-size="10" fill="#555">(keyword overlap; CV parsed via Groq)</text>

  <!-- Server 2: embedding-matcher-mcp -->
  <rect x="390" y="320" width="290" height="130" rx="10" fill="#EAFBEA" stroke="#2E9E44" stroke-width="1.5"/>
  <text x="535" y="343" text-anchor="middle" font-size="14" font-weight="600" fill="#1D6E2C">embedding-matcher-mcp</text>
  <text x="535" y="360" text-anchor="middle" font-size="10.5" fill="#333">mcp_servers/embedding_matcher/</text>
  <text x="535" y="390" text-anchor="middle" font-size="11" fill="#222">• match_jobs_from_cv_embedding</text>
  <text x="535" y="412" text-anchor="middle" font-size="10" fill="#555">(semantic/RAG match via pgvector</text>
  <text x="535" y="426" text-anchor="middle" font-size="10" fill="#555">cosine distance)</text>

  <!-- Server 3: job-crawler-mcp -->
  <rect x="710" y="320" width="290" height="130" rx="10" fill="#EAFBEA" stroke="#2E9E44" stroke-width="1.5"/>
  <text x="855" y="343" text-anchor="middle" font-size="14" font-weight="600" fill="#1D6E2C">job-crawler-mcp</text>
  <text x="855" y="360" text-anchor="middle" font-size="10.5" fill="#333">mcp_servers/crawler/</text>
  <text x="855" y="383" text-anchor="middle" font-size="11" fill="#222">• trigger_crawler</text>
  <text x="855" y="401" text-anchor="middle" font-size="11" fill="#222">• list_supported_sites</text>
  <text x="855" y="422" text-anchor="middle" font-size="10" fill="#555">(itviec.com dedicated + generic Firecrawl)</text>

  <!-- External APIs -->
  <rect x="70" y="490" width="200" height="55" rx="8" fill="#FFF4E5" stroke="#C9791A" stroke-width="1.5"/>
  <text x="170" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#8A5310">Groq API</text>
  <text x="170" y="530" text-anchor="middle" font-size="10.5" fill="#333">(external, chat + CV parsing)</text>

  <rect x="450" y="490" width="200" height="55" rx="8" fill="#FFF4E5" stroke="#C9791A" stroke-width="1.5"/>
  <text x="550" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#8A5310">Jina API</text>
  <text x="550" y="530" text-anchor="middle" font-size="10.5" fill="#333">(external, embeddings)</text>

  <rect x="830" y="490" width="200" height="55" rx="8" fill="#FFF4E5" stroke="#C9791A" stroke-width="1.5"/>
  <text x="930" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#8A5310">Firecrawl API</text>
  <text x="930" y="530" text-anchor="middle" font-size="10.5" fill="#333">(external, scraping)</text>

  <!-- Host Groq client -> Groq API -->
  <line x1="200" y1="242" x2="170" y2="488" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <!-- Server1 -> Groq API (CV parsing) -->
  <line x1="150" y1="450" x2="170" y2="488" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Server2 -> Jina API -->
  <line x1="560" y1="450" x2="555" y2="488" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Server3 -> Firecrawl API -->
  <line x1="900" y1="450" x2="930" y2="488" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Server3 -> Jina API (embed postings) -->
  <line x1="790" y1="450" x2="640" y2="488" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Postgres -->
  <rect x="330" y="610" width="440" height="70" rx="8" fill="#F3EAFB" stroke="#7A3FB5" stroke-width="1.5"/>
  <text x="550" y="635" text-anchor="middle" font-size="13" font-weight="600" fill="#4E1F80">PostgreSQL — jobs table + pgvector</text>
  <text x="550" y="654" text-anchor="middle" font-size="11" fill="#333">third_party/postgre_sql/ (Docker Compose) — relational store AND RAG vector store</text>

  <!-- Servers -> Postgres -->
  <line x1="245" y1="450" x2="420" y2="608" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="535" y1="450" x2="535" y2="608" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="450" x2="680" y2="608" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
